<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15101d">
  <title>दिवाली के रोचक तथ्य</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 18px; color: #fff6e9; background: radial-gradient(circle at top, #322037, #110e19 60%); font-family: system-ui, sans-serif; }
    main { width: min(900px, 100%); text-align: center; }
    .label { color: #e6b773; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    h1 { margin: 12px 0 4px; font-size: clamp(28px, 5vw, 46px); }
    p { color: #cbbac4; line-height: 1.6; }
    video { display: block; width: 100%; aspect-ratio: 9 / 16; max-width: 440px; margin: 24px auto; background: #08070c; border: 1px solid #574251; border-radius: 14px; box-shadow: 0 20px 60px #0006; }
    a { display: inline-block; color: #241423; background: #e9bc80; padding: 14px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    a:hover { background: #ffda9e; }
    .hint { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="label">✦ दीपावली विशेष ✦</div>
    <h1>दिवाली के रोचक तथ्य</h1>
    <p>हिंदी में एक छोटा वीडियो • 18 सेकंड</p>
    <video controls playsinline preload="metadata" src="./diwali-hindi.mp4">आपका ब्राउज़र वीडियो नहीं चला सकता।</video>
    <a href="./diwali-hindi.mp4" download="diwali-hindi.mp4">⬇ वीडियो डाउनलोड करें</a>
    <p class="hint">अगर वीडियो खुल जाए लेकिन डाउनलोड न हो, वीडियो पर राइट-क्लिक करके “Save video as…” चुनें।</p>
  </main>
</body>
</html>
